[project]
name = "invoice-quote-reconciliation"
version = "0.1.0"
description = "Reconcile supplier invoices against the quotes they belong to, on fully synthetic data."
requires-python = ">=3.11"
dependencies = ["reportlab>=4.0", "pdfplumber>=0.11"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
